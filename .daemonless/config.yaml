# dbuild configuration file
# Full reference: https://github.com/daemonless/dbuild

build:
  variants:
    - tag: latest
      containerfile: Containerfile
      default: true
      tag_desc: Stable release (*-stable) built from upstream source.
    # Upstream runs a *-beta line (v2.1.x) alongside *-stable (v2.0.x). Beta follows the newest
    # *-beta tag by the same lookup latest uses for *-stable, so the image's upstream labels
    # match what it runs and a rebuild picks up each new beta without a config edit.
    - tag: beta
      containerfile: Containerfile
      tag_desc: Beta release (*-beta) built from upstream source.
      args:
        UPSTREAM_JQ: '[.[] | select(.prerelease == false) | .tag_name | select(endswith("-beta"))][0]'

cit:
  mode: health
  port: 8080
  # Served with no auth middleware, so it answers before any user is created.
  health: /health
  ready: "Running at"
  # Frontend (npm ci + vite) plus a full Go build from source.
  timeout: 180
